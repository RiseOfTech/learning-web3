spring:
  application:
    name: learning-web3

ethereum:
  # Ethereum JSON-RPC endpoint (Infura, Alchemy, local node …)
  # Export: export WEB3J_RPC_URL=https://mainnet.infura.io/v3/<KEY>
  rpc-url: ${WEB3J_RPC_URL}

  # Raw hex private key of the signing account (no 0x prefix required).
  # Export: export WEB3J_PRIVATE_KEY=<your-private-key>
  private-key: ${WEB3J_PRIVATE_KEY}

  # USDT (Tether) ERC-20 on Ethereum mainnet — used for Transfer event monitoring.
  usdt-contract-address: "0xdAC17F958D2ee523a2206206994597C13D831ec7"

  # How many confirmations to wait for after sending a transaction.
  tx-receipt-poll-attempts: 40
  tx-receipt-poll-interval-ms: 2000

server:
  port: 8080

app:
  base-url: "http://localhost:8080"
  api-prefix: "/api/v1"
  errors-path: "${app.api-prefix}/errors"
  errors-url: "${app.base-url}${app.errors-path}"

logging:
  level:
    com.learningweb3: DEBUG
    org.web3j: WARN          # web3j is very chatty at INFO
